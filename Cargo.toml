[package]
name = "oneblood-cli"
description = "Unofficial read-only CLI for a OneBlood donor's blood type and per-donation readings (health-records/v1)."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/oneblood-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "oneblood"
path = "src/lib.rs"

[[bin]]
name = "oneblood"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
# `auth login --browser` (src/auth.rs, src/site.rs).
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
pk-med-records = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.2" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The unit tests build a `Captured` by hand. A dev-dependency only, so the
# binary is built without it.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
